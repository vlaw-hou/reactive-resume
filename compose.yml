name: reactive_resume

networks:
  caddynet:
    external: true

services:
  reactive_resume:
    container_name: reactive-resume
    image: ghcr.io/reactive-resume/reactive-resume:6.0.4
    networks:
      - caddynet
    ports:
      - 100.92.42.42:3987:3000
    environment:
      PORT: "3000"
      SERVER_PORT: "3001"
      APP_URL: http://reactive-resume:3000

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/reactive
      POSTGRES_DB: postgres
      POSTGRES_USER: defaultuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      
      AUTH_SECRET: ${AUTH_SECRET}

      STORAGE_BACKEND: "s3"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: "reactive-resume"
      S3_REGION: us-east-1
      S3_ENDPOINT: http://rustfs-server:9000

      AI_PROVIDER: openai-compatible
      AI_MODEL: ""
      AI_API_KEY: ""
      AI_BASE_URL: ""

      REDIS_URL: valkey://:${VALKEY_PASSWORD}@valkey-db:6379/3
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}  # default pw for valkey
      
    env_file:
      - path: .env
        required: false
    volumes:
      - /opt/vps3/vps3-data/reactive-resume/_data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3


